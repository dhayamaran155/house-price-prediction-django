<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 48px;
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid #e2e8f0;
        }

        .header h1 {
            font-size: 2.8rem;
            color: #0f172a;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .header p {
            color: #64748b;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .form-section {
            margin-bottom: 40px;
        }

        .form-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 20px;
            display: none;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-bottom: 32px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.15s; }
        .form-group:nth-child(3) { animation-delay: 0.2s; }
        .form-group:nth-child(4) { animation-delay: 0.25s; }
        .form-group:nth-child(5) { animation-delay: 0.3s; }
        .form-group:nth-child(6) { animation-delay: 0.35s; }
        .form-group:nth-child(7) { animation-delay: 0.4s; }
        .form-group:nth-child(8) { animation-delay: 0.45s; }
        .form-group:nth-child(9) { animation-delay: 0.5s; }
        .form-group:nth-child(10) { animation-delay: 0.55s; }
        .form-group:nth-child(11) { animation-delay: 0.6s; }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 10px;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
        }

        .form-group input,
        .form-group select {
            padding: 13px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.25s ease;
            height: 50px;
            letter-spacing: 0.3px;
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:hover,
        .form-group select:hover {
            border-color: #94a3b8;
            background-color: #f1f5f9;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08), 
                        0 0 0 6px rgba(59, 130, 246, 0.04);
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }

        .submit-btn {
            padding: 14px 56px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
            letter-spacing: 0.4px;
            min-width: 220px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.35);
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
        }

        .result-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1.5px solid #0ea5e9;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            animation: resultPulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 40px;
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5),
                        0 10px 30px rgba(6, 182, 212, 0.1);
        }

        @keyframes resultPulse {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-card h2 {
            font-size: 0.9rem;
            color: #0369a1;
            margin-bottom: 16px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .price-display {
            margin-bottom: 4px;
        }

        .result-card .price {
            font-size: 3.5rem;
            color: #0284c7;
            font-weight: 800;
            letter-spacing: -2px;
            word-break: break-word;
            line-height: 1;
        }

        .result-card .currency {
            font-size: 1.6rem;
            vertical-align: super;
            margin-right: -6px;
        }

        .result-subtitle {
            font-size: 0.85rem;
            color: #0a7ea4;
            margin-top: 16px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .card {
                padding: 32px;
            }

            .header {
                margin-bottom: 36px;
                padding-bottom: 24px;
            }

            .header h1 {
                font-size: 2.2rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-bottom: 28px;
            }

            .submit-btn {
                width: 100%;
                min-width: unset;
                min-height: 48px;
            }

            .result-card {
                padding: 32px;
                margin-top: 32px;
            }

            .result-card .price {
                font-size: 2.8rem;
            }

            .result-card h2 {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 24px;
                border-radius: 16px;
            }

            .header {
                margin-bottom: 28px;
                padding-bottom: 20px;
            }

            .header h1 {
                font-size: 1.9rem;
            }

            .header p {
                font-size: 0.9rem;
            }

            .form-grid {
                gap: 16px;
                margin-bottom: 24px;
            }

            .form-group label {
                font-size: 0.85rem;
            }

            .form-group input,
            .form-group select {
                font-size: 16px;
                height: 46px;
                padding: 12px 14px;
            }

            .submit-btn {
                padding: 12px 40px;
                font-size: 0.95rem;
                min-width: unset;
            }

            .result-card {
                padding: 24px;
                margin-top: 28px;
                border-radius: 12px;
            }

            .result-card .price {
                font-size: 2.2rem;
            }

            .result-card h2 {
                font-size: 0.8rem;
                margin-bottom: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>🏠 House Price Prediction</h1>
                <p>Enter property details to predict estimated market value</p>
            </div>

            <form id="predictionForm" method="POST">
                {% csrf_token %}

                <div class="form-section">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="bedrooms">Bedrooms</label>
                            <input type="number" id="bedrooms" name="bedrooms" step="any" required>
                        </div>

                        <div class="form-group">
                            <label for="bathrooms">Bathrooms</label>
                            <input type="number" id="bathrooms" name="bathrooms" step="any" required>
                        </div>

                        <div class="form-group">
                            <label for="sqft_living">Living Area (sqft)</label>
                            <input type="number" id="sqft_living" name="sqft_living" required>
                        </div>

                        <div class="form-group">
                            <label for="sqft_lot">Lot Area (sqft)</label>
                            <input type="number" id="sqft_lot" name="sqft_lot" required>
                        </div>

                        <div class="form-group">
                            <label for="floors">Floors</label>
                            <input type="number" id="floors" name="floors" step="any" required>
                        </div>

                        <div class="form-group">
                            <label for="waterfront">Waterfront</label>
                            <select id="waterfront" name="waterfront" required>
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="view">View Rating</label>
                            <input type="number" id="view" name="view" required>
                        </div>

                        <div class="form-group">
                            <label for="condition">Condition Rating</label>
                            <input type="number" id="condition" name="condition" required>
                        </div>

                        <div class="form-group">
                            <label for="sqft_above">Above Ground Area (sqft)</label>
                            <input type="number" id="sqft_above" name="sqft_above" required>
                        </div>

                        <div class="form-group">
                            <label for="sqft_basement">Basement Area (sqft)</label>
                            <input type="number" id="sqft_basement" name="sqft_basement" required>
                        </div>

                        <div class="form-group">
                            <label for="yr_built">Year Built</label>
                            <input type="number" id="yr_built" name="yr_built" required>
                        </div>
                    </div>
                </div>

                <div class="button-container">
                    <button type="submit" class="submit-btn">Predict Price</button>
                </div>
            </form>

            <div id="resultContainer"></div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const csrfToken = formData.get('csrfmiddlewaretoken');

            fetch('{% url "home" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'X-Requested-With': 'XMLHttpRequest',
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const resultHTML = `
                        <div class="result-card">
                            <h2>Predicted Price</h2>
                            <div class="price-display">
                                <div class="price">
                                    <span class="currency">$</span>${parseFloat(data.prediction).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                </div>
                            </div>
                            <p class="result-subtitle">Estimated market value based on property features</p>
                        </div>
                    `;
                    document.getElementById('resultContainer').innerHTML = resultHTML;
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while making the prediction');
            });
        });
    </script>
</body>
</html>
